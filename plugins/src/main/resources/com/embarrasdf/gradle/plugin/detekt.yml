# Static analysis settings shared by every embarrasdf repo, applied on top of detekt's default
# config. Rules that overlap with the format task (embarrasdfFormatCheck) are turned off here.

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  NamedArguments:
    active: true
    # Calls with two or more arguments name them, outside tests.
    allowedArguments: 1
    ignoreArgumentsMatchingNames: true
    ignoreMethods:
      # replace(old, new) reads clearly without names.
      - 'kotlin.text.replace'
    excludes: ['**/test/**', '**/*Test/**']

naming:
  # Checked by the format task.
  ClassNaming:
    active: false
  EnumNaming:
    active: false
  FunctionNaming:
    active: false
  MatchingDeclarationName:
    active: false
  ObjectPropertyNaming:
    active: false
  PackageNaming:
    active: false
  TopLevelPropertyNaming:
    active: false

style:
  MagicNumber:
    # Layout values in Composables (dp sizes, offsets, fractions) read better inline.
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateFunction:
    # Previews are private and only used by the IDE.
    ignoreAnnotated: ['Preview']
  # Checked by the format task.
  MaxLineLength:
    active: false
  NewLineAtEndOfFile:
    active: false
  NoTabs:
    active: false
  TrailingWhitespace:
    active: false
  UnusedImport:
    active: false
  WildcardImport:
    active: false

# compose-rules (io.nlopez.compose.rules). Each rule has to be turned on here.
Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: true
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
  ContentSlotReused:
    active: true
  ContentTrailingLambda:
    active: true
  DefaultsVisibility:
    active: true
  LambdaParameterEventTrailing:
    active: true
  LambdaParameterInRestartableEffect:
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposed:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberContentMissing:
    active: true
  RememberMissing:
    active: true
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true

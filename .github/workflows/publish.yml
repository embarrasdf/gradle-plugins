name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    uses: embarrasdf/devops/.github/workflows/publish.yml@main
    permissions:
      contents: write
      # The release changelog reads the merged pull requests.
      issues: read
      pull-requests: read
    with:
      tasks: publishAndReleaseToMavenCentral githubRelease
      runs-on: ubuntu-latest
      commit-pattern: ''
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      GPG_KEY: ${{ secrets.GPG_KEY }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}

# ktlint settings shared by every embarrasdf repo, passed to ktlint as .editorconfig overrides.
# gradle-plugins' own root build reads this file too, so its code follows the same rules.
ktlint_code_style = intellij_idea
max_line_length = 120

ij_kotlin_allow_trailing_comma = true
ij_kotlin_allow_trailing_comma_on_call_site = true
# No blank lines between single-line when branches.
ij_kotlin_line_break_after_multiline_when_entry = false

# Composable functions are PascalCase.
ktlint_function_naming_ignore_when_annotated_with = Composable
ktlint_property_naming_constant_naming = pascal_case

# Functions with two or more parameters put each on its own line; a single parameter stays on
# the signature line when it fits.
ktlint_function_signature_rule_force_multiline_when_parameter_count_greater_or_equal_than = 2

# Allowed styles: class signatures and supertype lists are laid out by the author,
# single-return block bodies are fine, and inline block comments label arguments.
ktlint_standard_class-signature = disabled
ktlint_standard_function-expression-body = disabled
ktlint_standard_comment-wrapping = disabled
